<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>قیمت بیت‌کوین</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:520px;margin:auto}
h1{text-align:center;color:#f5a623}
.box{background:#1e293b;border-radius:15px;padding:18px;margin:14px 0}
.price{font-size:32px;font-weight:bold;text-align:center;color:#f5a623}
.row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #39465a}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#f5a623;font-size:17px;font-weight:bold}
.small{text-align:center;color:#b8c2d3;font-size:13px}
</style>
</head>
<body>
<main>
<h1>₿ قیمت بیت‌کوین</h1>
<div class="box">
<div class="small">قیمت فعلی به دالر آمریکا</div>
<div id="current" class="price">در حال بارگذاری...</div>
<div id="updated" class="small"></div>
</div>
<div class="box">
<h3>مقایسه با گذشته</h3>
<div id="history">در حال دریافت قیمت‌ها...</div>
</div>
<button onclick="loadPrices()">تازه‌سازی قیمت</button>
<p class="small">این برنامه فقط قیمت را نشان می‌دهد و معامله انجام نمی‌دهد.</p>
<p id="error" class="small"></p>
</main>
<script>
const periods=[
["یک روز قبل",1],
["یک هفته قبل",7],
["یک ماه قبل",30],
["سه ماه قبل",90],
["یک سال قبل",365]
];
const money=n=>new Intl.NumberFormat('en-US',{
style:'currency',currency:'USD',maximumFractionDigits:2
}).format(n);
async function loadPrices(){
document.getElementById('error').textContent='';
document.getElementById('current').textContent='در حال بارگذاری...';
document.getElementById('history').textContent='در حال دریافت قیمت‌ها...';
try{
const now=Date.now();
const dates=periods.map(p=>new Date(now-p[1]*86400000));
const requests=dates.map(d=>{
const date=d.getUTCDate().toString().padStart(2,'0')+'-'+
(d.getUTCMonth()+1).toString().padStart(2,'0')+'-'+d.getUTCFullYear();
return fetch('https://api.coingecko.com/api/v3/coins/bitcoin/history?date='+date)
.then(r=>{if(!r.ok)throw Error('خطا در دریافت قیمت');return r.json()})
.then(j=>({label:periods[dates.indexOf(d)][0],price:j.market_data.current_price.usd}))
});
const currentResponse=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
if(!currentResponse.ok)throw Error('اتصال به منبع قیمت ناموفق بود');
const currentData=await currentResponse.json();
const current=currentData.bitcoin.usd;
document.getElementById('current').textContent=money(current);
document.getElementById('updated').textContent='آخرین بررسی: '+new Date().toLocaleString();
const results=await Promise.all(requests);
document.getElementById('history').innerHTML=results.map(item=>{
const diff=current-item.price;
const color=diff>=0?'#4ade80':'#f87171';
const sign=diff>=0?'+':'';
return '<div class="row"><span>'+item.label+'</span><span>'+money(item.price)+'</span></div>'+
'<div class="small" style="text-align:left;color:'+color+'">تغییر تا امروز: '+sign+money(diff)+'</div>';
}).join('');
}catch(e){
document.getElementById('current').textContent='قیمت دریافت نشد';
document.getElementById('history').textContent='اتصال اینترنت را بررسی کن و دوباره امتحان کن.';
document.getElementById('error').textContent='ممکن است سرویس قیمت محدودیت درخواست داشته باشد.';
}
}
loadPrices();
setInterval(loadPrices,60000);
</script>
</body>
</html>
